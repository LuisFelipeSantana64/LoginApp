<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgileBank - Registro</title>
    <style>
        /* Estilos do Corpo */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* --- Logo de Background--- */
        .background-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-25%, -25%);
            width: 80%;
            height: auto;
            opacity: 0.05; /* OPACIDADE BAIXA */
            pointer-events: none;
            z-index: 0;
        }

        /* --- Logo Pequena no Canto Superior Esquerdo --- */
        .small-logo {
            position: fixed;
            top: 20px;
            left: 30px;
            width: 60px; /* Tamanho pequeno */
            height: auto;
            z-index: 10;
        }

        /* Estilos do Container de Login */
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            width: 300px;
            position: relative;
            z-index: 1;
        }

        /* Demais Estilos */
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #3b4cb8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #2c3e50; }
        .error { color: red; text-align: center; margin-bottom: 10px; }
        .login-link { text-align: center; margin-top: 10px; }
        .login-link a { color: #3b4cb8; text-decoration: none; }
    </style>
</head>
<body>
    
    {% set logo_path = 'imagem/8fb04f43-68ba-4621-b053-72c10abe48d4.png' %}

    <img src="{{ url_for('static', filename=logo_path) }}" alt="AgileBank Logo" class="small-logo">

    <img src="{{ url_for('static', filename=logo_path) }}" alt="AgileBank Logo" class="background-logo">

    <div class="container">
        <h2>Registrar Conta</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <input type="text" name="nome" placeholder="Nome completo" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Registrar</button>
        </form>

        <div class="login-link">
            <p>Já tem conta? <a href="/login">Entrar</a></p>
        </div>
    </div>
</body>
</html>
